# Static hosting for the built SPA (Dockerfile). Security headers here are the source of truth
# in production; frame-ancestors cannot be set from a <meta> tag.
#
# Every add_header lives at server level on purpose: an add_header inside a location block
# replaces ALL inherited ones, which would silently drop the security headers.

map $uri $cache_control {
  ~^/assets/ "public, max-age=31536000, immutable";
  default    "no-store";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cache-Control $cache_control always;

  location /assets/ {
    try_files $uri =404;
  }

  # Client-side routes fall back to index.html (no-store, so deploys take effect at once).
  location / {
    try_files $uri /index.html;
  }
}
